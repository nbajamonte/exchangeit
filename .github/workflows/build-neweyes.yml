name: Build NEWeyes demo

on:
  push:
    branches:
      - neweyes-staging
    paths:
      - '.neweyes-staging/**'
      - 'build-neweyes.js'
      - '.github/workflows/build-neweyes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: neweyes-staging

      - name: Reconstruct NEWeyes HTML
        run: node build-neweyes.js

      - name: Commit reconstructed index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already up to date"
          else
            git commit -m "Build NEWeyes demo HTML"
            git push origin HEAD:neweyes-staging
          fi
